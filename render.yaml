services:
  - type: web
    name: nduom-university-hostel
    runtime: node
    region: frankfurt
    plan: starter
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.12.0
      - key: DATABASE_URL
        value: file:/var/data/hostel.db
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: hostel-data
      mountPath: /var/data
      sizeGB: 1
